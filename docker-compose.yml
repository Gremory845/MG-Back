services:
  postgres:
    image: postgres:16-alpine
    container_name: musical-game-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: musical_game
      POSTGRES_USER: musical_game
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musical_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: